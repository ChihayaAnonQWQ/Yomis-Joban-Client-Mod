plugins {
	id "com.github.johnrengelman.shadow"
}

loom {
	forge {
		mixinConfig "jsblock-common.mixins.json"
	}
}

architectury {
	platformSetupLoomIde()
	forge()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentForge.extendsFrom common
}

dependencies {
	forge "net.minecraftforge:forge:${rootProject.forge_version}"
	modApi "${rootProject.architectury_id}:architectury-forge:${rootProject.architectury_version}"

	common(project(path: ":common", configuration: "namedElements")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
	/* Bundled so the released jar carries the PIDS scripting engine (see gradle.properties). */
	shadowCommon "org.mozilla:rhino:${rootProject.rhino_version}"
}

processResources {
	filesMatching("META-INF/mods.toml") {
		expand (
			"version": "${project.mod_version}+mc${rootProject.minecraft_version}",
			"mc_version": rootProject.mc_requirement.replace(".x", "")
		)
	}
	/* The expanded values are not task inputs by themselves, so bumping mod_version left this
	   task UP-TO-DATE and the released jar kept whichever version it was first built with --
	   every build from 1.2.12 onwards shipped a mods.toml saying "1.2.12+mc1.20" while
	   fabric.mod.json, whose project happens to track it, said the real thing. Declaring the
	   version as an input makes the task re-run when it changes. */
	inputs.property("mod_version", project.mod_version)
	inputs.property("minecraft_version", rootProject.minecraft_version)
}

shadowJar {
	exclude "fabric.mod.json"

	configurations = [project.configurations.shadowCommon]
	archiveClassifier = "dev-shadow"
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier = ""
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

task moveForgeBuilds() {
//	doLast {
//		delete fileTree("../build").matching {
//			include "**/Joban-Client-Mod-forge*"
//		}
//	}
}

afterEvaluate {
	for (def task in it.tasks) {
		if (task == tasks.build) {
			task.finalizedBy tasks.moveForgeBuilds
		}
	}
}
