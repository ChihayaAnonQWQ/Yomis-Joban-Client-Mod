dependencies {
	modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	modApi "${rootProject.architectury_id}:architectury:${rootProject.architectury_version}"

	/* Rhino runs the JCM 2.x-compatible PIDS scripts (com.jsblock.script). It is only a
	   compile dependency here; each platform module bundles it through shadowCommon so the
	   released jar stays self-contained and needs no extra download at runtime. */
	implementation "org.mozilla:rhino:${rootProject.rhino_version}"
}

architectury {
	common("fabric", "forge")
}
