# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G

# Dependencies
parchment_11605=1.16.5:2022.03.06
parchment_11701=1.17.1:2021.12.12
parchment_11802=1.18.2:2022.11.06
parchment_11902=1.19.2:2022.11.27
parchment_11903=1.19.3:2023.03.12
parchment_11904=1.19.3:2023.03.12
parchment_12000=1.19.3:2023.03.12

# Mod Properties
# Follows the upstream version this fork is based on, with the JS-PIDS port revision appended:
# 1.2.12-JSPIDS-1.0 was the first published port build, this is the second.
mod_version=1.2.12-JSPIDS-1.4
maven_group=com.jsblock
mtr_version=latest

# JavaScript engine powering the JCM 2.x-compatible PIDS scripting (com.jsblock.script).
# JCM 2.x ships the same engine (it shades upstream Rhino into its own :rhino module),
# so scripts written for JCM 2.x run unmodified.
rhino_version=1.7.15

# Dependency versions pinned so the build configures and runs without network access.
# build.gradle only falls back to the live Modrinth / Fabric meta / Forge lookups when a
# value is missing here. Bump these when updating the toolchain.
architectury_version=9.2.14
fabric_loader_version=0.19.5
fabric_api_version=0.83.0+1.20
forge_version=1.20-46.0.14
mod_menu_version=7.0.1

# Assigned by build.gradle but never read (the project compiles against Mojang mappings).
# Pinned only so the build does not have to reach meta.fabricmc.net to configure.
yarn_version=1.20+build.1
